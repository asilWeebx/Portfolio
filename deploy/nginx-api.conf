# Frontend Vercel'da bo'lganda: backend alohida subdomenda.
# /etc/nginx/sites-available/api.asilbek-yuldashev.uz
# SSL: sudo certbot --nginx -d api.asilbek-yuldashev.uz
server {
    server_name api.asilbek-yuldashev.uz;
    client_max_body_size 25M;

    # Bosh sahifaga kirganlarni asosiy saytga yo'naltiramiz
    location = / { return 302 https://asilbek-yuldashev.uz; }

    location ~ ^/(api|admin|ckeditor5)/ {
        proxy_pass http://127.0.0.1:8010;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /sitemap.xml { proxy_pass http://127.0.0.1:8010; proxy_set_header Host $host; }
    location = /robots.txt  { proxy_pass http://127.0.0.1:8010; proxy_set_header Host $host; }

    location /static/ { alias /opt/portfolio/backend/staticfiles/; expires 30d; }
    location /media/  { alias /opt/portfolio/backend/media/; expires 7d; add_header Access-Control-Allow-Origin *; }
}
