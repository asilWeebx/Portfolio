# /etc/nginx/sites-available/asilbek-yuldashev.uz
# SSL: sudo certbot --nginx -d asilbek-yuldashev.uz -d www.asilbek-yuldashev.uz
server {
    server_name asilbek-yuldashev.uz www.asilbek-yuldashev.uz;
    client_max_body_size 25M;

    root /opt/portfolio/frontend/dist;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # React (SPA) — barcha sahifalar index.html'ga
    location / {
        try_files $uri $uri/ /index.html;
    }
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location /images/ { expires 30d; }

    # Django: API, admin, sitemap
    location ~ ^/(api|admin|ckeditor5)/ {
        proxy_pass http://127.0.0.1:8010;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /sitemap.xml { proxy_pass http://127.0.0.1:8010; proxy_set_header Host $host; }
    location = /robots.txt  { proxy_pass http://127.0.0.1:8010; proxy_set_header Host $host; }

    location /static/ { alias /opt/portfolio/backend/staticfiles/; expires 30d; }
    location /media/  { alias /opt/portfolio/backend/media/; expires 7d; }
}
